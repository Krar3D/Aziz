{f:"🌎",n:"Introduction",s:"",ar:"المقدمة",p:[
["The people of the United States are nearly all immigrants, or descendants of immigrants. It is a young country, and much of the population has relatives who live in other parts of the world.","سكان الولايات المتحدة هم في الغالب مهاجرون أو من أحفاد المهاجرين. إنها دولة فتية، ولدى جزء كبير من سكانها أقارب يعيشون في أنحاء أخرى من العالم."],
["But how do they find the US when they first arrive? What do they think of the people, the culture, the way of life? Jamie Peterson spoke to three of them.","لكن كيف يجدون أمريكا عند وصولهم أول مرة؟ وما رأيهم بالناس والثقافة وطريقة العيش؟ تحدّث جيمي بيترسون إلى ثلاثة منهم."]]},
{f:"🇹🇳",n:"Aziz Tounsi",s:"aged 24, from Tunisia",ar:"عزيز تونسي · 24 سنة · من تونس",p:[
["Aziz came from Tunis to New York ten years ago. He wanted to study English here. At first he missed everything – the sunshine, the food, his family. But now he has a successful business with his three brothers and his wife. They run a sports store in New Brunswick. Aziz’s wife is also Tunisian, and they have two children who go to American schools.","جاء عزيز من تونس العاصمة إلى نيويورك قبل عشر سنوات. أراد أن يدرس اللغة الإنجليزية هنا. في البداية اشتاق إلى كل شيء: الشمس والطعام وعائلته. لكنه الآن يملك عملًا ناجحًا مع إخوته الثلاثة وزوجته. يديرون متجرًا للمستلزمات الرياضية في نيو برونزويك. زوجة عزيز تونسية أيضًا، ولديهما طفلان يذهبان إلى مدارس أمريكية."],
["When asked about the future, Aziz says without hesitation, “I want to work hard and be successful.” He certainly works hard. He’s at the store all day, then works as a driver in the evening. “I like living here,” he says. “You can be what you want.”","عندما سُئل عن المستقبل، قال عزيز دون تردد: «أريد أن أعمل بجد وأن أكون ناجحًا.» وهو بالتأكيد يعمل بجد؛ فهو في المتجر طوال اليوم ثم يعمل سائقًا في المساء. يقول: «يعجبني العيش هنا. يمكنك أن تكون ما تريد.»"],
["“When I first came here, I didn’t speak the language, and it was winter. It was so cold! There was snow! Now nearly all my family are here, not only in New York, but also in California, and in Texas. We meet about once a month and have a huge Tunisian family meal! We’re all happy here.”","«عندما جئت إلى هنا أول مرة لم أكن أتكلم اللغة، وكان الوقت شتاءً. كان البرد شديدًا! وكان هناك ثلج! الآن معظم عائلتي هنا، ليس في نيويورك فقط بل في كاليفورنيا وتكساس أيضًا. نلتقي تقريبًا مرة في الشهر ونتناول وجبة عائلية تونسية ضخمة! كلنا سعداء هنا.»"]]},
{f:"🇭🇺",n:"Endre Boros",s:"aged 45, from Hungary",ar:"إندري بوروش · 45 سنة · من هنغاريا",p:[
["Endre is a mathematician at Rutgers University, New Jersey. He came from Budapest thirteen years ago. “I had an opportunity to come here for two years.” After a year, his wife came to join him, and since then they’ve had a daughter, so they decided to stay.","إندري عالم رياضيات في جامعة روتجرز في نيوجيرسي. جاء من بودابست قبل ثلاث عشرة سنة. «سنحت لي فرصة للمجيء إلى هنا لمدة سنتين.» وبعد سنة جاءت زوجته للانضمام إليه، ومنذ ذلك الحين رُزقا بابنة، فقررا البقاء."],
["“At first it was very strange. Everything is so big here,” he says. “I started to feel happy when I bought a car. Now I go everywhere by car. In Hungary, we only use the car at weekends, but here your car is part of your life. Nobody walks anywhere.”","يقول: «في البداية كان الأمر غريبًا جدًا. كل شيء هنا كبير جدًا. بدأت أشعر بالسعادة عندما اشتريت سيارة. الآن أذهب إلى كل مكان بالسيارة. في هنغاريا نستخدم السيارة في عطلات نهاية الأسبوع فقط، أما هنا فسيارتك جزء من حياتك. لا أحد يمشي إلى أي مكان.»"],
["How does he find the people? “Very friendly. The first question everybody asks you is ‘Where are you from?’ People talk to you here, they start conversations. I like the fact that there are people from all over the world.”","كيف يجد الناس؟ «ودودين جدًا. أول سؤال يطرحه عليك الجميع هو: ‹من أين أنت؟› الناس هنا يتحدثون معك ويبدؤون المحادثات. يعجبني أن هناك أناسًا من كل أنحاء العالم.»"],
["What about the way of life? “The thing I like best is the independence. Nobody tells me what to do. Here you can do what you want, so you learn to make decisions for yourself. I feel in control.”","وماذا عن طريقة العيش؟ «أكثر ما يعجبني هو الاستقلالية. لا أحد يخبرني ماذا أفعل. هنا يمكنك فعل ما تريد، لذلك تتعلم اتخاذ القرارات بنفسك. أشعر أنني متحكم بحياتي.»"]]},
{f:"🇭🇰",n:"Yuet Tung",s:"aged 31, from Hong Kong",ar:"يويت تونغ · 31 سنة · من هونغ كونغ",p:[
["Yuet Tung is her Chinese name, but in English she’s known as Clara. She came to the US eight years ago and studied fine art. Now she works on Madison Avenue for a publisher. She married a Vietnamese American three years ago, and they live in Long Island. They don’t have any children yet.","يويت تونغ هو اسمها الصيني، لكنها تُعرف بالإنجليزية باسم كلارا. جاءت إلى أمريكا قبل ثماني سنوات ودرست الفنون الجميلة. تعمل الآن في شارع ماديسون لدى دار نشر. تزوجت قبل ثلاث سنوات من أمريكي من أصل فيتنامي، ويعيشان في لونغ آيلاند. ليس لديهما أطفال بعد."],
["What does she think of living in New York? “It’s very similar to Hong Kong. It’s a busy city, very exciting, and people walk very fast! I like the stores here. They’re huge, and it’s cheaper than Hong Kong. But you need a car here. In Hong Kong everyone uses public transportation, because it’s good and it’s cheap. At first I hated driving here, but it’s OK now.”","ما رأيها بالعيش في نيويورك؟ «إنها تشبه هونغ كونغ كثيرًا. مدينة مزدحمة ومثيرة جدًا، والناس يمشون بسرعة كبيرة! تعجبني المتاجر هنا. إنها ضخمة والأسعار أرخص من هونغ كونغ. لكنك تحتاج إلى سيارة هنا. في هونغ كونغ يستخدم الجميع المواصلات العامة لأنها جيدة ورخيصة. في البداية كرهت القيادة هنا، لكن الأمر مقبول الآن.»"],
["What does she like best? “The space. Here I live in a house with a yard. In Hong Kong it is so crowded. And the people are friendly. When I go jogging, everyone says ‘Hi!’ And the food is from every country in the world.”","ما أكثر ما يعجبها؟ «المساحة. هنا أعيش في بيت له حديقة. في هونغ كونغ الازدحام شديد. والناس ودودون. عندما أذهب للركض يقول الجميع: ‹مرحبًا!› والطعام من كل بلدان العالم.»"]]}
];

["What do the people have in common?","ما القواسم المشتركة بين هؤلاء الأشخاص؟",[["","They are all immigrants near New York who came to study or work. Everything was difficult at first, but now they like living there.","كلهم مهاجرون قرب نيويورك جاؤوا للدراسة أو العمل. كان كل شيء صعبًا في البداية، لكنهم الآن يحبون العيش هناك."]]],
["Are they all happy living in the US?","هل جميعهم سعداء بالعيش في أمريكا؟",[["","Yes. Aziz says “We’re all happy here”, Endre feels in control, and Yuet Tung likes the space and the people.","نعم. عزيز يقول «كلنا سعداء هنا»، وإندري يشعر أنه متحكم بحياته، ويويت تونغ تحب المساحة والناس."]]],
["Who has other members of their family living there?","من لديه أفراد آخرون من عائلته يعيشون هناك؟",[["","Aziz: nearly all his family (New York, California, Texas). Endre: his wife and daughter. Yuet Tung: her husband.","عزيز: معظم عائلته (نيويورك وكاليفورنيا وتكساس). إندري: زوجته وابنته. يويت تونغ: زوجها."]]],
["Do they all have children?","هل لدى جميعهم أطفال؟",[["","No. Aziz has two children and Endre has a daughter, but Yuet Tung has no children yet.","لا. لدى عزيز طفلان ولدى إندري ابنة، أما يويت تونغ فليس لديها أطفال بعد."]]],

["What do they say about their own country?","ماذا يقولون عن بلدهم؟",[["","Aziz missed the sunshine, food and family of Tunisia. In Hungary people only use the car at weekends. In Hong Kong it’s crowded, and public transportation is good and cheap.","عزيز اشتاق إلى شمس تونس وطعامها وعائلته. في هنغاريا يستخدم الناس السيارة في عطلة نهاية الأسبوع فقط. في هونغ كونغ الازدحام شديد والمواصلات العامة جيدة ورخيصة."]]],

const wrap=t=>t.split(" ").map(w=>`<span class="w" tabindex="0">${w}</span>`).join(" ");
const blk=(e,a)=>`<div class="blk"><button class="pl" title="استمع">🔊</button><p class="en" dir="ltr">${wrap(e)}</p><p class="ar tr">${a}</p></div>`;
$("#txt").innerHTML=T.map((x,i)=>`<article class="card"><h2>${x.f} ${x.n}${x.s?` <small>${x.s}</small>`:""}</h2><p class="ar tr"><b>${x.ar}</b></p><button class="all" data-i="${i}">▶ استمع للنص كاملًا</button>${x.p.map(p=>blk(...p)).join("")}</article>`).join("");
$("#qa").innerHTML=Q.map(([le,la,ie,ia,items,num])=>`<article class="card"><h2>${le} <small>${la}</small></h2>${blk(ie,ia)}${items.map(([q,a,ans],i)=>`<div class="q">${num?`<b class="n">${i+1}</b>`:""}${blk(q,a)}${ans?`<button class="sh">إظهار الإجابة</button><div class="ansbox" hidden>${ans.map(([w,e,r])=>`${w?`<b>${w}</b>`:""}${blk(e,r)}`).join("")}</div>`:""}</div>`).join("")}</article>`).join("");
let rate=.85,voice,synth=window.speechSynthesis;
function pick(){const v=synth.getVoices().filter(x=>/^en/i.test(x.lang)),us=v.filter(x=>/en-US/i.test(x.lang));voice=us.find(x=>/Google|Samantha|Aria|Jenny/i.test(x.name))||us[0]||v[0]}
if(synth){try{pick();synth.onvoiceschanged=pick}catch(e){}}
function say(t,el){
if(!synth)return alert("هذا المتصفح لا يدعم النطق الصوتي");
synth.cancel();$$(".on").forEach(e=>e.classList.remove("on"));
const parts=[].concat(t);
parts.forEach((x,i)=>{const u=new SpeechSynthesisUtterance(x);u.lang="en-US";u.rate=rate;if(voice)u.voice=voice;
if(el){if(!i)el.classList.add("on");if(i==parts.length-1)u.onend=u.onerror=()=>el.classList.remove("on")}synth.speak(u)})}
document.addEventListener("click",e=>{const t=e.target,w=t.closest(".w");
if(w){const s=w.textContent.replace(/[^\p{L}’'-]/gu,"");if(s)say(s,w)}
else if(t.closest(".pl")){const b=t.closest(".blk");say($(".en",b).textContent,b)}
else if(t.classList.contains("all"))say(T[t.dataset.i].p.map(p=>p[0]),t.closest("article"));
else if(t.classList.contains("sh")){const b=t.nextElementSibling;b.hidden=!b.hidden;t.textContent=b.hidden?"إظهار الإجابة":"إخفاء الإجابة"}});
document.addEventListener("keydown",e=>{if(e.key=="Enter"&&e.target.classList.contains("w"))e.target.click()});
$$(".tab").forEach(b=>b.onclick=()=>{$$(".tab").forEach(x=>x.classList.toggle("act",x==b));$("#txt").hidden=b.dataset.t!="txt";$("#qa").hidden=b.dataset.t!="qa";if(synth)synth.cancel();scrollTo(0,0)});
$("#rate").onchange=e=>rate=+e.target.value;
$("#tr").onclick=()=>document.body.classList.toggle("hide");
$("#all").onclick=()=>{$("#txt").hidden=true;$("#qa").hidden=false;$$(".tab").forEach(x=>x.classList.toggle("act",x.dataset.t=="qa"));const o=$(".ansbox").hidden;$$(".ansbox").forEach(b=>b.hidden=!o);$$(".sh").forEach(b=>b.textContent=o?"إخفاء الإجابة":"إظهار الإجابة")};
</script></body></html>
